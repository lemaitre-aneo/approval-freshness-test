name: Eval workflow_run

on:
  workflow_run:
    workflows: [Relay]
    types: [completed]

permissions:
  checks: write
  statuses: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const { owner, repo } = context.repo;
            await github.rest.checks.create({ owner, repo, name: 'fresh-wfrun', head_sha: sha, status: 'completed', conclusion: 'success',
              output: { title: 'posted from workflow_run', summary: 'test' } });
            await github.rest.repos.createCommitStatus({ owner, repo, sha, state: 'success', context: 'fresh-wfrun-status', description: 'posted from workflow_run' });
